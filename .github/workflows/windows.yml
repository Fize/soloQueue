name: Windows compatibility

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.13.1
      - name: Test and build browser UIs
        run: |
          pnpm --dir web install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir status-ui install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir status-ui test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir status-ui build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force internal/assets/dist | Out-Null
          Remove-Item -Recurse -Force internal/assets/dist/web, internal/assets/dist/status -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force web/dist internal/assets/dist/web
          Copy-Item -Recurse -Force status-ui/dist internal/assets/dist/status
      - name: Check out pinned SILK decoder source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kn007/silk-v3-decoder
          ref: d216599502662db01c07cc0dfd95ff1f1eaaea02
          path: third-party/silk
          persist-credentials: false
      - name: Build Windows SILK decoder
        shell: bash
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          make -C third-party/silk/silk EXESUFFIX= 'CFLAGS=-O2 -Wall -Iinterface -Isrc -Itest' 'LINK.o.cmdline=$(LINK.o) $^ $(LDLIBS) -o $@.exe'
          make -C third-party/silk/silk EXESUFFIX= 'CFLAGS=-O2 -Wall -Iinterface -Isrc -Itest' 'LINK.o.cmdline=$(LINK.o) $^ $(LDLIBS) -o $@.exe' encoder
          cp third-party/silk/silk/decoder.exe silk-decoder.exe
      - name: Run Go tests on Windows
        run: go test ./...
      - name: Build executable
        run: go build -o soloqueue.exe ./cmd/soloqueue
      - name: Start server and check health
        run: |
          $env:SOLOQUEUE_WORK_DIR = Join-Path $env:RUNNER_TEMP 'soloqueue windows 测试'
          $goExe = (Get-Command go).Source
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $process = Start-Process -FilePath './soloqueue.exe' -ArgumentList 'serve', '--port', '18765' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($process.HasExited) { throw "Server exited with code $($process.ExitCode)" }
              try {
                $result = Invoke-RestMethod 'http://127.0.0.1:18765/healthz' -TimeoutSec 1
                if ($result.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Server health check failed' }
            $speech = '{"enabled":true,"model":"tiny","modelDir":""}'
            Invoke-RestMethod -Method Put -Uri 'http://127.0.0.1:18765/api/config/speech/' -ContentType 'application/json' -Body $speech | Out-Null
            $install = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18765/api/config/speech/install' -ContentType 'application/json' -Body '{"model":"tiny"}' -TimeoutSec 900
            if (-not $install.success) { throw "Speech installation failed: $($install.error)" }
            $status = Invoke-RestMethod 'http://127.0.0.1:18765/api/config/speech/status'
            if (-not $status.ready) { throw 'Installed speech dependencies are not ready' }
            $wav = Join-Path $env:RUNNER_TEMP 'speech-fixture.wav'
            $pcm = Join-Path $env:RUNNER_TEMP 'speech-fixture.pcm'
            $silk = Join-Path $env:RUNNER_TEMP 'speech-fixture.silk'
            Invoke-WebRequest 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/b5454/samples/jfk.wav' -OutFile $wav
            & $status.ffmpegBinary -y -i $wav -ar 16000 -ac 1 -f s16le $pcm
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg fixture conversion failed' }
            & './third-party/silk/silk/encoder.exe' $pcm $silk -Fs_API 16000
            if ($LASTEXITCODE -ne 0) { throw 'SILK fixture encoding failed' }
            $env:SOLOQUEUE_SPEECH_SILK_FIXTURE = $silk
            & $goExe test ./internal/channel/qq -run '^TestWindowsInstalledSpeechTranscribesSilk$' -count=1 -v
            if ($LASTEXITCODE -ne 0) { throw 'Windows speech transcription failed' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            $env:PATH = $oldPath
          }

  windows-native-workers:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test native embedding worker
        run: cargo +1.88.0 test --locked --manifest-path native/embedding/Cargo.toml
      - name: Test native classifier worker
        run: cargo +1.88.0 test --locked --manifest-path native/decide/Cargo.toml
