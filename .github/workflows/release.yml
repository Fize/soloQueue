name: Release

on:
  push:
    tags: ['v*']

# Serialize releases so concurrent versions cannot race while retagging images.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: meta
        run: python3 .github/scripts/release.py metadata
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Install pnpm
        run: npm install --global pnpm@12.16.1
      - name: Test release decisions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test and build both embedded browser UIs
        run: make build-assets
      - name: Test Go packages
        run: go test ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-assets
          path: internal/assets/dist
          if-no-files-found: error

  binaries:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: darwin
            arch: arm64
          - runner: ubuntu-24.04
            system: linux
            arch: amd64
          - runner: windows-2022
            system: windows
            arch: amd64
          - runner: macos-15-intel
            system: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: browser-assets
          path: internal/assets/dist
      - name: Check out pinned SILK decoder source
        if: matrix.system == 'windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kn007/silk-v3-decoder
          ref: d216599502662db01c07cc0dfd95ff1f1eaaea02
          path: third-party/silk
          persist-credentials: false
      - name: Build Windows SILK decoder
        if: matrix.system == 'windows'
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          make -C third-party/silk/silk EXESUFFIX= 'CFLAGS=-O2 -Wall -Iinterface -Isrc -Itest' 'LINK.o.cmdline=$(LINK.o) $^ $(LDLIBS) -o $@.exe'
          mkdir -p build
          cp third-party/silk/silk/decoder.exe build/silk-decoder.exe
          cat third-party/silk/LICENSE third-party/silk/silk/interface/SKP_Silk_SDK_API.h > build/SILK_LICENSES.txt
      - name: Build and package release binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.system }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          if [ "$GOOS" = windows ]; then export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"; fi
          mkdir -p build
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "build/soloqueue$suffix" ./cmd/soloqueue
          args=(--version "$VERSION" --os "$GOOS" --arch "$GOARCH" --binary "build/soloqueue$suffix" --output-dir release)
          "./build/soloqueue$suffix" version | grep -Fx "$VERSION"
          if [ "$GOOS" = windows ]; then args+=(--silk build/silk-decoder.exe --silk-license build/SILK_LICENSES.txt); fi
          python .github/scripts/release.py archive "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.system }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  archives:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - name: Generate checksums for all platform archives
        run: python3 .github/scripts/release.py checksums release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries
          path: release/*
          if-no-files-found: error

  image:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look up image by build inputs
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py image
      - name: Build missing or changed image
        if: steps.cached.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.cached.outputs.cache_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Tag version and stable alias
        env:
          CACHE_TAG: ${{ steps.cached.outputs.cache_tag }}
          DIGEST: ${{ steps.cached.outputs.digest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          BUILD: ${{ steps.cached.outputs.build }}
        run: |
          set -euo pipefail
          source="$IMAGE:$CACHE_TAG"
          if [ -n "$DIGEST" ]; then source="$IMAGE@$DIGEST"; fi
          tags=(--tag "$IMAGE:$GITHUB_REF_NAME")
          if [ "$PRERELEASE" = false ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$source"
          # An unchanged image keeps the ORIGINAL binary version and OCI revision.
          # New standalone binary archives always carry the current release version.
          echo "Image: $IMAGE:$GITHUB_REF_NAME; rebuilt: $BUILD" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD" = false ]; then
            echo "Unchanged build inputs: reused $DIGEST. Embedded version and OCI labels retain the original build version." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: [prepare, archives, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binaries
          path: release
      - name: Prepare release notes from changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          heading="## [$VERSION]"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="$heading" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1 }
            found && /^## \[/ && $0 != heading && index($0, heading " - ") != 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No changelog entry found for $VERSION" >&2
            exit 1
          fi
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Listing fails on authentication/network errors, unlike a blind view-or-create.
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [ -z "$existing" ]; then
            flags=(--verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$GITHUB_REF_NAME")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*
          else
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
