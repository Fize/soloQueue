openapi: 3.0.3
info:
  title: SoloQueue Workflow Execution API
  version: 2.0.0
  description: >-
    Structured task input, isolated Git worktrees, durable checkpoints, manual
    recovery, and auditable workflow execution.
paths:
  /api/workflows/builtin:
    get:
      summary: List built-in workflow catalog and install state
      responses:
        '200':
          description: Built-in workflow catalog
  /api/workflows/builtin/install:
    post:
      summary: Explicitly install selected built-in workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  minItems: 1
                  items: {type: string}
      responses:
        '200':
          description: Installation result
        '409':
          $ref: '#/components/responses/InvalidRunState'
  /api/workflows/{name}/runs:
    post:
      summary: Start a workflow run
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartWorkflowRunRequest'
      responses:
        '202':
          description: Run persisted and scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/workflows/{name}/runs/{runID}/pause:
    post:
      summary: Request a graceful or forced pause
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '202':
          $ref: '#/components/responses/RunAccepted'
        '409':
          $ref: '#/components/responses/InvalidRunState'
  /api/workflows/{name}/runs/{runID}/resume:
    post:
      summary: Manually resume an interrupted or paused run
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
      responses:
        '202':
          $ref: '#/components/responses/RunAccepted'
        '409':
          $ref: '#/components/responses/InvalidRunState'
  /api/workflows/{name}/runs/{runID}/restart:
    post:
      summary: Start a fresh run linked to an existing run
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartRequest'
      responses:
        '202':
          $ref: '#/components/responses/RunAccepted'
  /api/workflows/{name}/runs/{runID}/abandon:
    post:
      summary: Mark a paused or interrupted run abandoned
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
      responses:
        '202':
          $ref: '#/components/responses/RunAccepted'
        '409':
          $ref: '#/components/responses/InvalidRunState'
  /api/workflows/{name}/runs/{runID}/events:
    get:
      summary: List append-only audit events
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
  /api/workflows/{name}/runs/{runID}/cleanup:
    post:
      summary: Explicitly remove a run worktree
      parameters:
        - $ref: '#/components/parameters/WorkflowName'
        - $ref: '#/components/parameters/RunID'
        - name: force
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '202':
          $ref: '#/components/responses/RunAccepted'
        '409':
          $ref: '#/components/responses/InvalidRunState'
components:
  parameters:
    WorkflowName:
      name: name
      in: path
      required: true
      schema:
        type: string
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
  schemas:
    WorkflowTask:
      type: object
      required: [goal, acceptance_criteria]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 20000
        acceptance_criteria:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 4000
        constraints:
          type: array
          items:
            type: string
            maxLength: 4000
        delivery:
          $ref: '#/components/schemas/DeliveryRequest'
    StartWorkflowRunRequest:
      type: object
      required: [task]
      properties:
        task:
          $ref: '#/components/schemas/WorkflowTask'
        repository:
          type: string
          description: Defaults to the server work directory when omitted.
        base_ref:
          type: string
          description: Defaults to HEAD when omitted.
        branch:
          type: string
        source:
          type: string
    StartWorkflowRunResponse:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [pending, preparing_worktree]
    PauseRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [graceful, force]
          default: graceful
    RestartRequest:
      type: object
      properties:
        base_ref:
          type: string
        repository:
          type: string
    DeliveryRequest:
      type: object
      description: Delivery actions are optional and are executed only when explicitly enabled by the task.
      properties:
        commit:
          type: object
          properties:
            enabled: {type: boolean}
            message: {type: string}
        push:
          type: object
          properties:
            enabled: {type: boolean}
            remote: {type: string}
            branch: {type: string}
        pull_request:
          type: object
          properties:
            enabled: {type: boolean}
            title: {type: string}
            body: {type: string}
            draft: {type: boolean}
    RunEvent:
      type: object
      required: [id, run_id, type, created_at]
      properties:
        id:
          type: integer
        run_id:
          type: string
        node_run_id:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        hash:
          type: string
    EventListResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        error:
          type: string
          nullable: true
  responses:
    RunAccepted:
      description: Command accepted
      content:
        application/json:
          schema:
            type: object
            required: [run_id]
            properties:
              run_id:
                type: string
    InvalidRunState:
      description: Run cannot perform this command in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        error:
          type: string
