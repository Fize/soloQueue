[package]
name = "soloqueue-decide"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
laya-onnx = { path = "vendor/laya-onnx", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_LibraryLoader"] }
