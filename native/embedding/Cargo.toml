[package]
name = "soloqueue-embedding"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24", "coreml", "cuda", "directml"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }
